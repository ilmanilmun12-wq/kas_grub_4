<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Kas Grup 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

  <div class="login-wrapper">
    <div class="login-card">
      <div class="  d">
        <div class="brand-icon">
  <img src="Bg1.jpg" alt="Logo Kas Grup 4">
</div>
        <h1>KAS GROUP 4</h1>
        <p>Disiplin , bekerja keras , Bertanggung jawab</p>
      </div>

      <form id="loginForm" class="login-form" autocomplete="off">
        <div id="loginError" class="login-error hidden"></div>

        <div class="input-group">
          <label for="username">Username</label>
          <div class="input-field">
            <span class="input-icon">👤</span>
            <input type="text" id="username" placeholder="Masukkan username" required>
          </div>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <div class="input-field">
            <span class="input-icon"></span>
            <input type="password" id="password" placeholder="Masukkan password" required>
            <button type="button" id="togglePassword" class="toggle-eye" aria-label="Tampilkan/Sembunyikan Password">
              <span id="eyeIcon">👁️</span>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-login">Masuk</button>
      </form>
    </div>
  </div>

<script src="auth.js"></script>
</body>
</html>
